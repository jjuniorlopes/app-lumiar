services:
  postgres:
    image: postgres:16-alpine
    container_name: lumiar_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumiar}
      POSTGRES_USER: ${POSTGRES_USER:-lumiar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumiar_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumiar} -d ${POSTGRES_DB:-lumiar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumiar_network

  redis:
    image: redis:7-alpine
    container_name: lumiar_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumiar_network

  api:
    build: ./apps/api
    container_name: lumiar_api
    env_file: .env
    ports:
      - "8000:8000"
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - lumiar_network

  web:
    build: ./apps/web
    container_name: lumiar_web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - lumiar_network

volumes:
  postgres_data:
  redis_data:

networks:
  lumiar_network:
    driver: bridge

