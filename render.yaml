services:
  - type: web
    name: lumiar-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile.prod
    plan: free
    disk:
      name: lumiar-uploads
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: MOBILE_APP_URL
        value: https://lumiar-api.onrender.com/api/v1/public/scan
      - key: GOOGLE_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_AI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AI_MODEL
        value: gpt-4o-mini
      - key: AI_TIMEOUT_SECONDS
        value: "25"
      - key: AI_CHAT_MAX_OUTPUT_TOKENS
        value: "400"
      - key: STORAGE_PATH
        value: /var/data/uploads
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false

  - type: web
    name: lumiar-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
