<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162d3a" />
    <meta name="description" content="Lumiar - Acessibilidade Conectada: Plataforma SaaS para gestão de acervos, audiodescrição inteligente e curadoria acessível para museus, espaços culturais e turismo." />
    <title>Lumiar | Acessibilidade Conectada</title>
    
    <!-- Tipografia Arquitetural Lumiar: Inter (Portal, Login, Mobile), Montserrat (Institucional/Curador), OpenDyslexic (A11y) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&family=Montserrat:wght@600;700;800&family=OpenDyslexic&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Container principal da aplicação React -->
    <div id="root"></div>

    <!-- Plugin Oficial do VLibras (Padrão eMAG 3.1 / gov.br) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      try {
        new window.VLibras.Widget('https://vlibras.gov.br/app');
      } catch (e) {
        console.warn('VLibras widget não pôde ser inicializado imediatamente:', e);
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
